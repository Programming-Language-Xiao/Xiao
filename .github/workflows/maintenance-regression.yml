name: Xiao maintenance regression

on:
  push:
    paths:
      - ".github/workflows/maintenance-regression.yml"
      - "core/rust/**"
      - "tests/fuzz/**"
      - "tests/benchmarks/**"
      - "tests/fixtures/**"
      - "stdlib/**"
      - ".gitattributes"
  pull_request:
    paths:
      - ".github/workflows/maintenance-regression.yml"
      - "core/rust/**"
      - "tests/fuzz/**"
      - "tests/benchmarks/**"
      - "tests/fixtures/**"
      - "stdlib/**"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-default-tests:
    name: Rust workspace default tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust -> core/rust/target

      - name: Run default workspace tests
        run: cargo test --manifest-path core/rust/Cargo.toml --workspace

      - name: Run benchmark workspace tests and driver self-test
        run: |
          cargo test --manifest-path tests/benchmarks/Cargo.toml
          cargo run --quiet --manifest-path tests/benchmarks/Cargo.toml --bin performance_driver -- --self-test

  deterministic-size:
    name: Deterministic artifact size regression (Windows baseline)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust -> core/rust/target

      - name: Check deterministic artifact size baseline
        run: cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test artifact_size_regression

  security-maintenance:
    name: Deterministic parser and artifact security regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust -> core/rust/target

      - name: Run parser and archive fuzz regressions
        run: |
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-bytecode --test fuzz_xiaoc
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-xar --test fuzz_archive

      - name: Run artifact and archive security boundaries
        run: |
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-artifacts
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-xar
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test cross_platform_release --test release_report

  native-regression:
    name: Native differential regression (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust -> core/rust/target
      - name: Install Windows LLVM
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
      - name: Build runtime and run native gates
        if: runner.os == 'Windows'
        env:
          XIAO_LLVM_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $installation) { throw 'MSVC installation missing' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          $batch = '"' + $vcvars + '" >nul && set'
          $environment = & cmd.exe /d /s /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64 failed' }
          foreach ($line in $environment) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) {
              Set-Item -Path ('Env:' + $line.Substring(0, $separator)) -Value $line.Substring($separator + 1)
            }
          }
          # Prepend the MSVC linker after importing vcvars; never resolve Git's link.exe.
          $linkerBin = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64'
          if (-not (Test-Path "$linkerBin/link.exe")) { throw 'MSVC link.exe missing' }
          $env:PATH = "$linkerBin;$env:PATH"
          $llvmBin = Join-Path $env:XIAO_LLVM_ROOT 'ucrt64/bin'
          foreach ($tool in @('clang', 'llvm-as', 'llc', 'llvm-strip')) {
            if (-not (Test-Path "$llvmBin/$tool.exe")) { throw "Missing LLVM tool: $tool" }
          }
          $env:XIAO_CLANG = "$llvmBin/clang.exe"
          $env:XIAO_LLVM_AS = "$llvmBin/llvm-as.exe"
          $env:XIAO_LLC = "$llvmBin/llc.exe"
          $env:XIAO_STRIP = "$llvmBin/llvm-strip.exe"
          $env:XIAO_TARGET_TRIPLE = ((& rustc -vV | Select-String '^host:').ToString().Split(':', 2)[1]).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'rustc host probe failed' }
          cargo build --manifest-path core/rust/Cargo.toml --release -p xiao-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path core/rust/Cargo.toml -p xiao-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XIAO_RUNTIME_LIBRARY = Join-Path $pwd 'core/rust/target/release/xiao_runtime.lib'
          $env:XIAO_DIAGNOSTICS_PATH = Join-Path $pwd 'core/rust/target/debug/xiao-diagnostics.exe'
          $env:XIAO_DIAGNOSTICS_HOLD_MS = '0'
          foreach ($artifact in @($env:XIAO_RUNTIME_LIBRARY, $env:XIAO_DIAGNOSTICS_PATH)) {
            if (-not (Test-Path $artifact)) { throw "Required artifact missing: $artifact" }
          }
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-runtime -p xiao-runtime-abi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Windows runner 没有交互式终端，窗口握手和调试执行仅在 Linux/Xvfb 作业运行。
          # DNS 依赖和平台异常子进程由父用例驱动，两个平台都排除子测试本身。
          cargo test --manifest-path core/rust/Cargo.toml --workspace --no-fail-fast -- --ignored --nocapture `
            --skip dns_resolution_failure_is_unavailable `
            --skip platform_failure_child `
            --skip real_terminal_session_is_environment_gated `
            --skip native_table_methods_debug_execution_o0_o3
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test 22c_vm_concurrency
          exit $LASTEXITCODE

      - name: Build runtime and run Linux native gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm xvfb xterm
          sudo update-alternatives --set x-terminal-emulator /usr/bin/xterm
          export XIAO_CLANG="$(command -v clang)"
          export XIAO_LLVM_AS="$(command -v llvm-as)"
          export XIAO_LLC="$(command -v llc)"
          export XIAO_STRIP="$(command -v llvm-strip)"
          export XIAO_TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$XIAO_TARGET_TRIPLE"
          test -x "$XIAO_STRIP"
          cargo build --manifest-path core/rust/Cargo.toml --release -p xiao-runtime
          cargo build --manifest-path core/rust/Cargo.toml -p xiao-diagnostics
          export XIAO_RUNTIME_LIBRARY="$PWD/core/rust/target/release/libxiao_runtime.a"
          export XIAO_DIAGNOSTICS_PATH="$PWD/core/rust/target/debug/xiao-diagnostics"
          export XIAO_DIAGNOSTICS_HOLD_MS=0
          test -f "$XIAO_RUNTIME_LIBRARY"
          test -x "$XIAO_DIAGNOSTICS_PATH"
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-runtime -p xiao-runtime-abi
          # Xvfb/xterm 和诊断组件已就绪，Linux push 门真实执行终端握手与 O0–O3 调试矩阵。
          # 只排除外部 DNS 和由父用例驱动的平台异常子进程。
          xvfb-run -a cargo test --manifest-path core/rust/Cargo.toml --workspace --no-fail-fast -- --ignored --nocapture \
            --skip dns_resolution_failure_is_unavailable \
            --skip platform_failure_child
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test 22c_vm_concurrency

      - name: Build runtime and run macOS native gates
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          llvm_root="$(brew --prefix llvm)"
          export XIAO_CLANG="$llvm_root/bin/clang"
          export XIAO_LLVM_AS="$llvm_root/bin/llvm-as"
          export XIAO_LLC="$llvm_root/bin/llc"
          export XIAO_STRIP="$llvm_root/bin/llvm-strip"
          export XIAO_TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          test -x "$XIAO_CLANG"
          test -x "$XIAO_LLVM_AS"
          test -x "$XIAO_LLC"
          test -x "$XIAO_STRIP"
          cargo build --manifest-path core/rust/Cargo.toml --release -p xiao-runtime
          cargo build --manifest-path core/rust/Cargo.toml -p xiao-diagnostics
          export XIAO_RUNTIME_LIBRARY="$PWD/core/rust/target/release/libxiao_runtime.a"
          export XIAO_DIAGNOSTICS_PATH="$PWD/core/rust/target/debug/xiao-diagnostics"
          export XIAO_DIAGNOSTICS_HOLD_MS=0
          test -f "$XIAO_RUNTIME_LIBRARY"
          test -x "$XIAO_DIAGNOSTICS_PATH"
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-runtime -p xiao-runtime-abi
          # macOS runner 与 Windows 一样没有可交互终端；Linux/Xvfb 保留这两项执行证据。
          cargo test --manifest-path core/rust/Cargo.toml --workspace --no-fail-fast -- --ignored --nocapture \
            --skip dns_resolution_failure_is_unavailable \
            --skip platform_failure_child \
            --skip real_terminal_session_is_environment_gated \
            --skip native_table_methods_debug_execution_o0_o3
          cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test 22c_vm_concurrency

      - name: Run 20D and 20E resource, process and archive fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test 20d_first_api --test 20d_process_api --test 20e_archive_wiring

      - name: Run 20D and 20E resource, process and archive fixtures (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --manifest-path core/rust/Cargo.toml -p xiao-driver --test 20d_first_api --test 20d_process_api --test 20e_archive_wiring
