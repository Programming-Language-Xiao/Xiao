name: Xiao B6-1 macOS

on:
  push:
    branches: [codex/b6-macos-runner]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: B6-1 macOS ${{ matrix.suite }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [native, resources]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      XIAO_B6_SUITE: ${{ matrix.suite }}
    steps:
      - name: Checkout the runner snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Set up LLVM 21
        run: brew install llvm@21
      - name: Run the B6-1 suite
        run: |
          python3 -B tools/gates/b2_b6_macos.py run \
            --suite "$XIAO_B6_SUITE" --llvm-bin "$(brew --prefix llvm@21)/bin" \
            --output "$RUNNER_TEMP/b6-evidence"
      - name: Upload logs and source and binary identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b6-1-macos-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b6-evidence
          if-no-files-found: warn
