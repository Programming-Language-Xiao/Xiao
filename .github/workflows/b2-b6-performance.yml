name: Xiao B6-2 macOS performance

on:
  push:
    branches: [codex/b6-performance-runner]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: B6-2 macOS ${{ matrix.backend }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [vm, o0, o3]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      XIAO_B6_BACKEND: ${{ matrix.backend }}
    steps:
      - name: Checkout the measurement snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install LLVM 21
        run: brew install llvm@21
      - name: Build and measure the fixed release snapshot
        run: |
          python3 -B tools/gates/b2_b6_performance.py run \
            --backend "$XIAO_B6_BACKEND" --llvm-bin "$(brew --prefix llvm@21)/bin" \
            --task "$RUNNER_TEMP/b6-performance"
      - name: Upload measurement receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b6-2-macos-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b6-performance/evidence
          if-no-files-found: warn
