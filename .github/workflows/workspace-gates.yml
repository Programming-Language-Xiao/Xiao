name: Xiao workspace gates

on:
  push:
    paths:
      - ".github/workflows/workspace-gates.yml"
      - ".github/workflows/platform-reproduction.yml"
      - "tools/**"
      - "cli/**"
      - "docs/**"
      - "stdlib/**"
      - "tests/research/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsconfig.*"
      - "core/rust/rust-toolchain.toml"
      - ".gitattributes"
  pull_request:
    paths:
      - ".github/workflows/workspace-gates.yml"
      - ".github/workflows/platform-reproduction.yml"
      - "tools/**"
      - "cli/**"
      - "docs/**"
      - "stdlib/**"
      - "tests/research/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsconfig.*"
      - "core/rust/rust-toolchain.toml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-workspace-gates:
    name: Linux workspace gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Configure locked Cargo and numeric environment
        run: python tools/gates/controlled-cargo.py --install

      - name: Record B6-4 checkout before gates
        continue-on-error: true
        run: python -B -X utf8 docs/DevDocs/assets/20o-b2-b/entry-20261119-b6-4/ci_identity.py before

      - name: Prepare Linux toolchain and Runtime for B6 diagnostics
        shell: bash
        run: bash docs/DevDocs/assets/20o-b2-b/entry-20261119-b6-4/linux_runtime.sh

      - name: Record Linux Runtime for B6 diagnostics
        continue-on-error: true
        run: python -B -X utf8 docs/DevDocs/assets/20o-b2-b/entry-20261119-b6-4/ci_identity.py native

      - name: Run workspace gates
        shell: bash
        run: bash tools/gates/run.sh

      - name: Record B6-4 checkout after gates
        if: always()
        continue-on-error: true
        run: python -B -X utf8 docs/DevDocs/assets/20o-b2-b/entry-20261119-b6-4/ci_identity.py after
