name: Xiao platform reproduction

on:
  workflow_dispatch:

jobs:
  reproduce:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            shell: bash
          - name: linux-arm64
            os: ubuntu-24.04-arm
            shell: bash
          - name: macos-arm64
            os: macos-14
            shell: bash
          - name: windows-amd64
            os: windows-2025
            shell: pwsh

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux tools
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm xvfb xterm file

      - name: Install macOS LLVM
        if: startsWith(matrix.name, 'macos-')
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Windows LLVM
        if: startsWith(matrix.name, 'windows-')
        run: choco install llvm --yes --no-progress

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Run Unix reproduction
        if: matrix.shell == 'bash'
        env:
          XIAO_USE_XVFB: ${{ startsWith(matrix.name, 'linux-') && '1' || '0' }}
        run: bash tools/platform-reproduction/reproduce.sh native

      - name: Run Windows reproduction
        if: matrix.shell == 'pwsh'
        run: powershell -ExecutionPolicy Bypass -File tools/platform-reproduction/reproduce.ps1 -Mode native
