name: Xiao platform reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            shell: bash
          - name: linux-arm64
            os: ubuntu-24.04-arm
            shell: bash
          - name: macos-arm64
            os: macos-14
            shell: bash
          - name: windows-amd64
            os: windows-2025
            shell: pwsh

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/rust -> core/rust/target
            tests/benchmarks -> tests/benchmarks/target

      - name: Install Linux tools
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm xauth xvfb xterm file
          sudo update-alternatives --set x-terminal-emulator /usr/bin/xterm || true

      - name: Install macOS LLVM
        if: startsWith(matrix.name, 'macos-')
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Windows LLVM
        if: startsWith(matrix.name, 'windows-')
        run: choco install llvm file --yes --no-progress

      - name: Run Unix reproduction
        if: matrix.shell == 'bash'
        env:
          XIAO_USE_XVFB: ${{ startsWith(matrix.name, 'linux-') && '1' || '0' }}
          XIAO_SKIP_REAL_TERMINAL_TEST: ${{ matrix.name == 'macos-arm64' && '1' || '0' }}
        run: |
          mkdir -p artifacts
          set +e
          printf 'runner=%s\nos=%s\narch=%s\nplatform=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "${{ matrix.name }}" | tee "artifacts/${{ matrix.name }}.log"
          bash tools/platform-reproduction/reproduce.sh native 2>&1 | tee -a "artifacts/${{ matrix.name }}.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Run Windows reproduction
        if: matrix.shell == 'pwsh'
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/platform-reproduction/reproduce.ps1 -Mode native 2>&1 | Tee-Object -FilePath artifacts/${{ matrix.name }}.log
          $status = $LASTEXITCODE
          if ($status -ne 0) { exit $status }

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiao-platform-reproduction-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
