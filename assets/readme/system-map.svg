<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">Xiao system map</title>
  <desc id="desc">A project-native map of Xiao's source, static analysis layers, runtime core, and planned execution consumers.</desc>

  <rect width="1200" height="520" rx="28" fill="#07090D"/>
  <path d="M74 132 H1126 M74 416 H1126" stroke="#273242" stroke-width="1"/>
  <path d="M98 476 L352 44" stroke="#A8CCFF" stroke-width="18" opacity="0.16"/>
  <path d="M188 476 L442 44" stroke="#949DFF" stroke-width="10" opacity="0.20"/>
  <path d="M1000 476 L1120 274" stroke="#F7F8FB" stroke-width="8" opacity="0.12"/>

  <g id="header" transform="translate(74 64)">
    <text x="0" y="0" fill="#A8CCFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">XIAO / SYSTEM MAP</text>
    <text x="0" y="42" fill="#F7F8FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" font-weight="700">一份语义，两个消费方向</text>
  </g>

  <g id="source-layer" transform="translate(74 142)">
    <text x="0" y="0" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">01 / SOURCE</text>
    <rect x="0" y="22" width="202" height="92" rx="12" fill="#0E141D" stroke="#F7F8FB"/>
    <text x="20" y="57" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">.xiao</text>
    <text x="20" y="88" fill="#A8CCFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">config.xiao</text>
  </g>

  <g id="static-core" transform="translate(326 142)">
    <text x="0" y="0" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">02 / STATIC CORE</text>
    <rect x="0" y="22" width="418" height="92" rx="12" fill="#111A27" stroke="#949DFF"/>
    <text x="20" y="57" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">xiao-syntax</text>
    <text x="174" y="57" fill="#949DFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">→ xiao-types</text>
    <text x="20" y="91" fill="#A8CCFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">→ xiao-lifetime</text>
    <text x="238" y="91" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">AST / types / plans</text>
  </g>

  <path d="M276 188 H326" stroke="#F7F8FB" stroke-width="2"/>
  <path d="M316 180 L326 188 L316 196" fill="none" stroke="#F7F8FB" stroke-width="2"/>

  <g id="runtime-layer" transform="translate(770 142)">
    <text x="0" y="0" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">03 / CURRENT RUNTIME</text>
    <rect x="0" y="22" width="344" height="92" rx="12" fill="#0E141D" stroke="#A8CCFF"/>
    <text x="20" y="57" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">xiao-runtime</text>
    <text x="20" y="90" fill="#A8CCFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19">对象、句柄、表生命周期首版</text>
  </g>

  <path d="M744 188 H770" stroke="#F7F8FB" stroke-width="2"/>
  <path d="M760 180 L770 188 L760 196" fill="none" stroke="#F7F8FB" stroke-width="2"/>

  <g id="planned-consumers" transform="translate(326 296)">
    <text x="0" y="0" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">04 / PLANNED CONSUMERS</text>
    <rect x="0" y="22" width="294" height="86" rx="12" fill="#0E141D" stroke="#A8CCFF" stroke-dasharray="8 7"/>
    <text x="20" y="57" fill="#F7F8FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="600">xiao run</text>
    <text x="20" y="87" fill="#A8CCFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Rust bytecode VM</text>

    <rect x="328" y="22" width="294" height="86" rx="12" fill="#0E141D" stroke="#949DFF" stroke-dasharray="8 7"/>
    <text x="348" y="57" fill="#F7F8FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="600">xiao build</text>
    <text x="348" y="87" fill="#949DFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">LLVM native path</text>
  </g>

  <path d="M942 256 V284 M942 284 L800 318 M942 284 L1084 318" fill="none" stroke="#A8CCFF" stroke-width="2" stroke-dasharray="8 7"/>

  <g id="quality-gates" transform="translate(74 444)">
    <text x="0" y="0" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">QUALITY GATES</text>
    <text x="176" y="0" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">spec snapshots</text>
    <text x="390" y="0" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Rust tests</text>
    <text x="552" y="0" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">UseDocs</text>
  </g>
</svg>
