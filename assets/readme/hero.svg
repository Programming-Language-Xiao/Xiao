  <g id="title-block" transform="translate(64 52)">
    <text x="0" y="0" fill="#A8CCFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">PROGRAMMING LANGUAGE / WORKSPACE</text>
    <text x="0" y="82" fill="#F7F8FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="78" font-weight="700">Xiao</text>
    <text x="0" y="128" fill="#949DFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="30" font-weight="600">静态边界，双执行路径</text>
    <text x="0" y="166" fill="#B7C0CE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">从源码、类型与生命周期，走向可裁剪的运行时。</text>

    <path d="M0 198 H522" stroke="#273242" stroke-width="1"/>
    <text x="0" y="232" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">0.1.0</text>
    <text x="106" y="232" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">·</text>
    <text x="130" y="232" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">DESIGN-FIRST</text>
    <text x="294" y="232" fill="#7C8796" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">·</text>
    <text x="318" y="232" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">IN DEVELOPMENT</text>

    <rect x="0" y="260" width="522" height="76" rx="12" fill="#0E141D" stroke="#273242"/>
    <text x="22" y="292" fill="#8DAEC9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">syntax specimen / static analysis</text>
    <text x="22" y="320" fill="#F7F8FB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">int total = 1 + 2</text>
  </g>

