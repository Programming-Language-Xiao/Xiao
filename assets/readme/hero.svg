     role="img" aria-labelledby="title desc">
  <title id="title">Xiao programming language</title>
  <desc id="desc">Xiao's name, static-analysis specimen, and the official geometric Xiao logo.</desc>

  <defs>
    <clipPath id="hero-clip">
      <rect width="1200" height="420" rx="28"/>
