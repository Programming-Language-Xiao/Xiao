[package]
name = "xiao-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Structured Xiao diagnostics"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xiao-diagnostics"
path = "src/bin/xiao-diagnostics.rs"

[dependencies]
xiao-source = { path = "../xiao-source" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
