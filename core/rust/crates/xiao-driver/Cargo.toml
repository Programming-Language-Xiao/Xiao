[package]
name = "xiao-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Xiao compiler and runtime driver interfaces"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xiao-core"
path = "src/protocol_main.rs"

[dependencies]
xiao-diagnostics = { path = "../xiao-diagnostics" }
xiao-source = { path = "../xiao-source" }
xiao-config = { path = "../xiao-config" }
xiao-syntax = { path = "../xiao-syntax" }
xiao-types = { path = "../xiao-types" }
xiao-modules = { path = "../xiao-modules" }
xiao-lifetime = { path = "../xiao-lifetime" }
xiao-ir = { path = "../xiao-ir" }
xiao-bytecode = { path = "../xiao-bytecode" }
xiao-vm = { path = "../xiao-vm" }
xiao-codegen-llvm = { path = "../xiao-codegen-llvm" }
xiao-runtime = { path = "../xiao-runtime" }
xiao-runtime-abi = { path = "../xiao-runtime-abi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
xiao-ir = { path = "../xiao-ir" }
